<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Trial ended</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" type="image/x-icon" href="./favicon.ico" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <main class="page">
            <article class="ticket">
                <div class="ticket__main">
                    <div class="ticket__brand" aria-label="Netlify brand">
                        <div class="ticket__brand-mark" aria-hidden="true">
                            <img
                                src="./public/netlify-logo.png"
                                alt="Netlify logo"
                            />
                        </div>
                    </div>
                    <h1 class="ticket__title">
                        Your pitbudget site has grown!
                    </h1>
                    <p class="ticket__text">
                        Upgrade now to a paid plan continue enjoying Netlify's
                        services.
                    </p>
                    <a
                        class="ticket__button"
                        target="_blank"
                        rel="noopener noreferrer"
                        href="https://www.netlify.com/"
                        >Upgrade now</a
                    >
                </div>
            </article>
        </main>
    </body>
</html>
